name: CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/cd_docker_project:latest .
        
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Push Docker image to Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/cd_docker_project:latest
        
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy via ngrok
        run: |
          echo "🚀 Deploying application..."
          echo "✅ Docker image pushed: ${{ secrets.DOCKER_USERNAME }}/cd_docker_project:latest"
          echo "✅ Application available via ngrok tunnel"
          echo "📝 Note: In production, this would deploy to a VPS via SSH"
